# The gate, on a machine that is not the operator's (P4 E8.0 / W5).
#
# The local hook is the one that fires most; this is the backstop, and it is
# the only check that ever runs on a clean clone — which is the half of E8.0
# that says a fresh clone installs and runs the suite with no hand steps.
#
# It deliberately installs from pyproject rather than environment.yml: the
# claim being tested is that the declared package metadata is enough.
name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: gate
        # The suite runs at whatever hour the runner happens to start, which is
        # why the noticing tests stopped reading the wall clock (W5): the wake
        # window is a gate on the being's behaviour and was silently a gate on
        # the test run.
        run: python tools/gate.py
