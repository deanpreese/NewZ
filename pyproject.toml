[project]
name = "newz"
version = "0.1.0"
description = "Second system (S2) — sovereign digital being. Direction: TRUE_NORTH.md; spec: SPEC.md; plan: PLAN.md."
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "httpx>=0.27",
    # Declared 2026-08-14 for S2 §9.1's full-extraction half (R3). Both were
    # already installed and relied on ambient state, which is worse than a
    # declaration. This runs against the lean-dependency preference recorded
    # in S2 §16 (the pydantic -> dataclasses review change), so the reason is
    # measured rather than assumed: trafilatura reduced a 364,607-char
    # Wikipedia page to 52,581 chars of clean body. The fallback chain
    # without it ends at strip_tags, which is crude enough to feed nav menus,
    # cookie banners and related-article lists into claim extraction — the
    # being would record claims about newsletter signups as things it read.
    "trafilatura>=2.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-timeout>=2.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["newz*"]
