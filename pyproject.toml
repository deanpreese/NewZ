[project]
name = "newz"
version = "0.1.0"
description = "A rigorous investigator of contested claims"
requires-python = ">=3.13"
# The whole third-party surface, one ADR each. ADR-0003 set the floor at zero;
# ADR-0004 took pypdf for PDF text and ADR-0005 took cryptography for erasure.
dependencies = [
    "pypdf>=6",
    "cryptography>=46",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["newz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --timeout=60"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
