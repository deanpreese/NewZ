# The instrument registry (PLAN E8.1).
#
# Every executable in tools/ appears here exactly once. An `instrument` is
# read-only, is what the SEL and the operator may steer by, and carries the
# fields the registry exists to make checkable: what it measures, what it
# reads, whether a model touched ANY link in its chain, its denominator, and
# its Rule 0 method line.
#
# `model_in_chain: true` does NOT mean the tool calls a model. It means a model
# judgment sits somewhere between the world and the number — at the read, or
# earlier, when the data it reads was labelled. PLAN Rule 4 is why the
# distinction is recorded rather than assumed: a judge that is the being's own
# model produces operation, never evidence.
#
# `canonical: true` marks the frozen set (E3.9) — changing one is an operator
# act, because the loop steers by these while changing the being that produces
# them.
#
# Writers: hand-maintained, and tests/test_instruments_registry.py fails the
# build when a tool is added without a row.
# Readers: tests/test_instruments_registry.py today; the SEL's state read
# (E8.3) and the metric-to-purpose map (E2.6) next.

version: 1

instruments:

  - tool: tools/evidence.py
    reads: [perspective.diff_json, perspective_items, concerns, ingest_log]
    measures: >
      1-E: Perspective development per night — added, revised, carried,
      released, disputed, and the pooled novelty share over the window.
      2-E: pursuit — the advance boundary, judged advances, the stall pool,
      and the §9.1 ingest share.
    denominator: "1-E: developed + carried (items held after the night). 2-E: advances judged; feeds polled"
    model_in_chain: true
    model_where: >
      The read itself consults no model (INV-023 — diffs are computed by
      comparing item sets, never narrated). But `added` / `revised` / `carried`
      are labels the model applied during consolidation, and 2-E's judged
      counts come from judge_advance. Clean instrument, model-labelled input.
    method: "direct reads off perspective.diff_json and perspective_items; no model consulted at read time"
    exit_code: "0 always — it reports, it does not judge"
    canonical: true

  - tool: tools/what_shaped.py
    reads: [perspective_items, evidence_refs, episodes, sources]
    measures: "provenance mix behind a held position — self / operator / world — and INV-033's single-source flag"
    denominator: "evidence references per position"
    model_in_chain: false
    known_bias: "R-15 — imported v1 episodes are uniformly provenance='self', so the self share is overstated for anything grounded in the import"
    method: "provenance assigned at write time, counted at read; no model at either end"
    canonical: true

  - tool: tools/gate_report.py
    reads: [gate_log]
    measures: "gate verdict counts, hold rate over candidates, and the per-clause breakdown"
    denominator: "candidates seen (stated in the tool's own docstring — 'gate health with a denominator')"
    model_in_chain: true
    model_where: "the gate is a model judge (newz/gate/outbound.py:226). Every verdict counted here is the being's own model judging the being"
    method: "counts off gate_log rows"
    canonical: true

  - tool: tools/budget.py
    reads: [logs/llm_calls.jsonl]
    measures: "token spend by function, and the §9.1 diet ceilings it implies"
    denominator: "total tokens in the window"
    model_in_chain: false
    method: "prompt+completion per call, tagged at the call site"
    unreadable_when: "the call log is gitignored and does not travel with a clone — INV-044's case, and the reason the §9.1 ingest share reads UNREADABLE rather than zero"
    canonical: true

  - tool: tools/claims.py
    reads: [claims, claim_costs, claim_refusals]
    measures: "claims made, their resolution condition, resolver, verdict and cost; and claims the door refused, with the reason"
    denominator: null
    model_in_chain: true
    model_where: "claim extraction and the resolver's verdict both pass through the model at write time — though INV-047 makes the resolver a reader of the world and never a judge of the being"
    method: "direct reads off the resolutions tables"
    canonical: true
    note: >
      A READER, not yet an instrument: it renders claims and computes no rate,
      no resolution latency and no count of positions changed by a resolution.
      S1-E — the plan's own gating read — has no reader until E8.6 promotes it.

  - tool: tools/source_review.py
    reads: [ingest_log, source_gaps, data/feeds.yaml, data/canon.yaml]
    measures: "outlet shares against the diet caps, feeds contributing a read, and the questions no readable source answered"
    denominator: "items ingested in the window; feeds configured"
    model_in_chain: true
    model_where: "triage decides what is read at all, so 'feeds contributing a read' is downstream of a model judgment even though the counting is mechanical"
    method: "shares over a rolling window (newz/world/diet.py); gaps written by research.py when the adapters answer nothing usable"
    canonical: true

  - tool: tools/read_works.py
    reads: [works]
    measures: "the being's pieces, retrievable by id"
    denominator: null
    model_in_chain: true
    model_where: "the pieces are model compositions"
    method: "direct reads off works"
    canonical: true

  - tool: tools/health.py
    reads: [main store, interior store, backups, process state, logs/llm_calls.jsonl]
    measures: "liveness and plumbing — up, answered, backed up, migrations applied, diet line"
    denominator: null
    model_in_chain: false
    method: "direct checks; exit 0 all clear, 1 warnings, 2 failures"
    canonical: true
    note: "explicitly NOT an evidence instrument (P2 Rule 3) — it reports liveness, never development"

  - tool: tools/check_invariants.py
    reads: [INVARIANTS.md, the tree]
    measures: "ledger well-formedness — ids unique, statuses valid, tests and consumers resolvable"
    denominator: "rows present"
    model_in_chain: false
    method: "regex parse of the ledger table; tests verified by scanning for the def"
    canonical: true
    note: "checks the rows it HAS, never coverage — nothing detects a table or flag that shipped without a row"

# ── everything else in tools/, enumerated so the registry is complete ──

not_instruments:

  probes:            # call a model; produce a verdict about the system, not a measurement
    - tools/bench_model.py
    - tools/claim_door_probe.py
    - tools/conversation_probe.py
    - tools/opener_probe.py
    - tools/redteam_ingest.py
    - tools/triage_probe.py

  mutators:          # write to the store
    - tools/adjudicate.py
    - tools/amend_constitution.py
    - tools/backfill_perspective_items.py
    - tools/embed_episodes.py
    - tools/journal.py
    - tools/perspective_hygiene.py

  runners:           # operate the being
    - tools/run_newz.py
    - tools/run_deliberation.py
    - tools/run_first_sleep.py
    - tools/run_import.py
    - tools/run_orientation.py
    - tools/run_sleep.py
    - tools/write_piece.py

  generators:        # read the store, write files, never write the store.
                     # Not instruments: they produce the surface rather than a
                     # measurement, so they answer to E3.2's manifest rather
                     # than to Rule 7's grades.
    - tools/generate_surface.py
    - tools/serve_surface.py
    - tools/rebuild_check.py
    - tools/freeze_check.py

  one_time:          # migrations and operations, not part of any cycle
    - tools/backup.py
    - tools/corpus_hygiene.py

# ── metrics, and the grade each one carries (P4 E2.5, Rule 7) ───────────
#
# Rule 7: every measurement carries its grade. An instrument is not one grade —
# `evidence.py` emits a mechanical coverage figure and a mixed novelty figure
# in the same report — so the grade belongs to the METRIC, not to the tool.
#
#   mechanical    no model judgment anywhere between the world and the number.
#   model-graded  a model decided something the number counts. Useful, readable,
#                 and it may never carry a decision on its own (Rule 4).
#   mixed         the read consults no model and its INPUT was model-labelled.
#   known-biased  mechanical, with a named systematic distortion.
#
# An ungraded metric cannot be cited: newz/evidence/grades.py raises rather
# than printing a number with no provenance, which is how Rule 7 stops being a
# convention and starts being a mechanism.

metrics:

  advances_offered:
    definition_version: 1
    baselined: true
    serves: [evidence:S1-E, tn10:volume]
    emitted_by: tools/claims.py
    grade: model-graded
    reason: >
      a count of concern_advances rows — and a row exists because judge_advance
      accepted it. Graded `mechanical` when E2.5 wrote the registry, on the
      reasoning that counting rows is mechanical; corrected 2026-08-20 while
      E3.7 composed it, because `concerns_closed` was graded model-graded for
      exactly the same shape (a count of rows a model's judgment created) and
      one of the two was wrong. Counting is mechanical; what is being counted
      is a judgment.

  claims_opened:
    definition_version: 1
    baselined: true
    serves: [evidence:S1-E, decision:phase1]
    emitted_by: tools/claims.py
    grade: mechanical
    reason: a count of resolutions rows; the door's verdict is structural, not judged.

  claims_refused:
    definition_version: 1
    baselined: true
    serves: [decision:phase1]
    emitted_by: tools/claims.py
    grade: mechanical
    reason: a count of claim_refusals rows, each written by a code check.

  claims_declined:
    definition_version: 1
    baselined: true
    serves: [decision:phase1]
    emitted_by: tools/claims.py
    grade: mechanical
    unreadable_when: >
      the tagged call log is absent. INV-046 keeps declines out of the store by
      design, so without it "the being commits to nothing" and "the door was
      never called" are the same reading — the metric reports UNREADABLE rather
      than zero.
    reason: a count of claim_door calls answering no; no model is asked to classify them.

  positions_changed_by_world:
    definition_version: 1
    baselined: true
    serves: [evidence:S1-E, decision:phase1]
    emitted_by: tools/claims.py
    grade: mechanical
    reason: >
      claim_costs rows. INV-048 writes them by TRACING a claim's provenance to
      the episodes and the Perspective items citing them — no model chooses who
      paid, which is why S1-E turns on a count.

  positions_changed_by_operator:
    definition_version: 1
    baselined: true
    serves: [evidence:S1-E]
    emitted_by: tools/claims.py
    grade: mixed
    reason: >
      a revised item attributed by the dominant provenance of its evidence.
      The attribution is a derivation, not a measurement.

  positions_changed_by_self:
    definition_version: 1
    baselined: true
    serves: [evidence:S1-E, tn10:novelty-without-consequence]
    emitted_by: tools/claims.py
    grade: known-biased
    reason: >
      as above, and R-15: imported v1 episodes are uniformly provenance='self',
      so this column is overstated for anything grounded in the import.

  concerns_refused:
    definition_version: 1
    baselined: true
    serves: [decision:phase1]
    emitted_by: tools/claims.py
    grade: mechanical
    reason: a count of concern_refusals rows, each written by a code check (INV-051).

  closing_condition_shape:
    definition_version: 1
    serves: [decision:phase1]
    emitted_by: tools/claims.py
    grade: mechanical
    reason: >
      a regex over the opening clause of each closing condition. `reachable` is
      a queue to read rather than a count to trust — the first run put two
      concerns there and both were commissioned research the keywords missed.

  perspective_novelty:
    definition_version: 1
    serves: [tn10:consistency, tn10:volume]
    emitted_by: tools/evidence.py
    grade: mixed
    reason: >
      the read consults no model (INV-023 — diffs are computed by comparing item
      sets, never narrated). Its inputs, added/revised/carried, are labels the
      model applied during consolidation. Clean instrument, model-labelled input.

  perspective_coverage:
    definition_version: 1
    serves: [tn10:novelty-without-consequence]
    emitted_by: tools/evidence.py
    grade: mechanical
    reason: whether an item cites anything, counted; never whether the citation supports it.

  advance_acceptance:
    definition_version: 1
    serves: [tn10:novelty-without-consequence]
    emitted_by: tools/evidence.py
    grade: model-graded
    reason: >
      judge_advance decides every numerator and denominator. Rule 4 names this
      judge, and P3 nonetheless cited the figure as evidence — the inconsistency
      that produced Rule 7.

  concerns_closed:
    definition_version: 1
    serves: [tn10:volume]
    emitted_by: tools/evidence.py
    grade: model-graded
    reason: judge_closure decides it (INV-034).

  stall_pool:
    definition_version: 1
    serves: [decision:phase1]
    emitted_by: tools/evidence.py
    grade: mechanical
    reason: recorded setback kinds, counted; no model is asked why a pursuit failed.

  grounding_mix:
    definition_version: 1
    serves: [tn10:autonomy-without-perspective, evidence:S1-E]
    emitted_by: tools/what_shaped.py
    grade: known-biased
    reason: >
      provenance assigned at write time and counted at read, and R-15's import
      bias applies to the self share.

  gate_hold_rate:
    definition_version: 1
    serves: [evidence:S6-E, tn10:guardrails]
    emitted_by: tools/gate_report.py
    grade: model-graded
    reason: the gate is a model judge; every verdict counted here is the being judging itself.

  token_share_by_function:
    definition_version: 1
    serves: [kill:loop-spend, invariant:diet, evidence:S5-E]
    emitted_by: tools/budget.py
    grade: mechanical
    unreadable_when: the call log is gitignored and does not travel with a clone (INV-044).
    reason: prompt+completion per call, tagged at the call site.

  feeds_contributing_a_read:
    definition_version: 1
    baselined: true
    serves: [evidence:S1-E]
    emitted_by: tools/source_review.py
    grade: model-graded
    reason: >
      the counting is mechanical and triage decides what is read at all, so the
      figure is downstream of a model judgment. P4's E2.9 lists this among the
      metrics "all graded mechanical"; the 2026-08-19 audit found otherwise and
      the measured grade stands. It informs and it may not carry a decision
      alone (Rule 4) — recorded here rather than reconciled away, because the
      plan's assumption and the audit's finding are both part of the record.

  work_subject_tags:
    definition_version: 1
    serves: [evidence:S2-E]
    emitted_by: tools/read_works.py
    grade: mechanical
    reason: >
      inverse document frequency over the works corpus. No vocabulary is
      authored and no model is asked what a piece is about (INV-056).

  # ── the mechanical set (E2.9) — what the loop may steer by ────────────
  # Every one is a count or a ratio of counts over rows the being wrote as it
  # lived. No model judgment sits anywhere between the world and the number,
  # which is the whole qualification for carrying a decision (Rule 4).

  nights_slept:
    definition_version: 1
    baselined: true
    serves: [kill:nights-slept, evidence:S8-E, tn10:volume]
    emitted_by: newz/evidence/mechanical.py
    grade: mechanical
    reason: >
      Perspective versions written in the window. P4 Phase 8 calls this the kill
      condition that matters most — development is measured in nights, not
      commits, and a loop that costs sleep is subtracting.

  hours_since_last_sleep:
    definition_version: 1
    baselined: true
    serves: [kill:nights-slept]
    emitted_by: newz/evidence/mechanical.py
    grade: mechanical
    reason: elapsed time since the last consolidation; rises when sleep stops happening.

  pieces_written:
    definition_version: 1
    baselined: true
    serves: [evidence:S2-E, decision:phase2, tn10:volume]
    emitted_by: newz/evidence/mechanical.py
    grade: mechanical
    reason: a count of works rows in the window.

  works_revised:
    definition_version: 1
    baselined: true
    serves: [evidence:S2-E, decision:phase2]
    emitted_by: newz/evidence/mechanical.py
    grade: mechanical
    reason: >
      a count of work_revisions rows of kind 'revised'. P4 Phase 2's decision
      rule turns on this against pieces_written: produces on rhythm but never
      revises means the re-read is decorative.

  works_retracted:
    definition_version: 1
    baselined: true
    serves: [evidence:S2-E, decision:phase2]
    emitted_by: newz/evidence/mechanical.py
    grade: mechanical
    reason: a count of work_revisions rows of kind 'retracted'; a retraction is an outcome (INV-054).

  source_gaps_open:
    definition_version: 1
    baselined: true
    serves: [evidence:S1-E]
    emitted_by: newz/evidence/mechanical.py
    grade: mechanical
    reason: >
      questions no readable source answered, counted. §Going public's own
      trip-wire for the room no longer being enough.

  single_source_positions:
    definition_version: 1
    baselined: true
    serves: [tn10:autonomy-without-perspective, evidence:S1-E]
    emitted_by: newz/evidence/mechanical.py
    grade: known-biased
    reason: >
      the share of held positions where one provenance supplies more than half
      the evidence — INV-033's flag, counted per position. Mechanical, and
      R-15 applies: imported v1 episodes are uniformly provenance='self', so
      positions grounded in the import are flagged for a reason that is partly
      an artefact of the import.

  self_grounding_share:
    definition_version: 1
    baselined: true
    serves: [tn10:autonomy-without-perspective, evidence:S1-E]
    emitted_by: newz/evidence/mechanical.py
    grade: known-biased
    reason: >
      the share of all supporting episodes whose provenance is 'self'. This is
      the figure PLAN §1 states as 50%, and it is NOT single_source_positions,
      which counts positions with a dominant source — a different quantity, and
      pointing a premise at the near-neighbour is E2.8's "novelty" mistake in a
      new place. R-15 applies: imported v1 episodes are uniformly self.

  deliberation_token_share:
    definition_version: 1
    baselined: true
    serves: [evidence:S5-E, invariant:diet, kill:loop-spend]
    emitted_by: newz/evidence/mechanical.py
    grade: mechanical
    unreadable_when: the call log is gitignored and does not travel with a clone (INV-044).
    reason: deliberation tokens over all tokens in the window, tagged at the call site.

  operator_disagreement_rate:
    definition_version: 1
    baselined: true
    serves: [tn10:agreement]
    emitted_by: newz/evidence/agreement.py
    grade: model-graded
    reason: >
      the share of exchanges that put a position at stake in which the being
      pushed back rather than moved to the operator's view. A model classifies
      each exchange, so the judgement is a model's — and the judged party is
      the being while the configuring party is the operator, which is why this
      may halt and may never justify (newz/evidence/authority.py). §10's
      "compliance or agreement with the operator" had no raw material anywhere
      until E3.8, and it is the item most likely to move under a process
      optimising for a quiet week.
    unreadable_when: >
      no exchange in the window put a position at stake. A rate of 0 would read
      as "never disagrees" when it means "was never asked to".

  # ── the derivation layer (E3.7) ───────────────────────────────────────
  # Four of TRUE_NORTH §10's six checkable items, as ratios of what the store
  # already holds. A derived metric takes the WEAKEST grade among its inputs:
  # a mechanical numerator over a model-graded denominator is model-graded, and
  # cannot carry a decision neither input could.

  episodes_recorded:
    definition_version: 1
    baselined: true
    serves: [tn10:volume]
    emitted_by: newz/evidence/derived.py
    grade: mechanical
    reason: a count of episodes rows in the window; nothing judges what becomes one.

  volume_against_development:
    definition_version: 1
    baselined: true
    derived_from: [episodes_recorded, perspective_novelty]
    serves: [tn10:volume]
    emitted_by: newz/evidence/derived.py
    grade: mixed
    reason: >
      episodes recorded per Perspective item added or revised. §10's "activity,
      memory growth, or output volume" — a rising number is the being doing
      more and holding no more for it. Mixed because the denominator's
      added/revised labels are the model's, applied at consolidation.

  restatement_rate:
    definition_version: 1
    baselined: true
    derived_from: [perspective_novelty]
    serves: [tn10:consistency]
    emitted_by: newz/evidence/derived.py
    grade: mixed
    reason: >
      1 − novelty: the share of what is held that is being restated. §10's
      "personality consistency without development", and mixed for the same
      reason novelty is.

  consequence_rate:
    definition_version: 1
    baselined: true
    derived_from: [advances_offered, claims_opened]
    serves: [tn10:novelty-without-consequence, evidence:S1-E]
    emitted_by: newz/evidence/derived.py
    grade: model-graded
    reason: >
      claims settled per advance accepted. §10's "novelty without relevance or
      consequence" — advances accumulating while nothing is ever settled is
      that item, and today it is exactly zero, which is S1-E stated as a ratio.
      Model-graded because the denominator counts what judge_advance accepted.

  autonomy_against_world_grounding:
    definition_version: 1
    baselined: true
    derived_from: [advances_offered, self_grounding_share]
    serves: [tn10:autonomy-without-perspective]
    emitted_by: newz/evidence/derived.py
    grade: model-graded
    reason: >
      unprompted acts per unit of world-grounded position. §10's "autonomy
      without perspective or purpose". The denominator is the WORLD share
      rather than a count of positions, because a being can hold a great many
      positions and still be talking to itself. Model-graded by inheritance:
      the numerator counts advances, and an advance row exists because
      judge_advance accepted it — the judgment sits in an input rather than in
      the composition, which is exactly why a derivation takes the weakest
      grade among its parts.

# ── purposes: what a measurement is FOR (P4 E2.6, Rule 2) ───────────────
#
# Rule 2 says no table or flag ships without a writer and a reader. E2.6
# extends it to measurements: a metric nothing consumes is the same defect as
# a column nothing reads, and the ledger has caught the second for months while
# nothing caught the first.
#
# Both directions are tested. No metric may exist without naming a purpose it
# serves, and no purpose may name a metric that does not exist. What is NOT an
# error is a purpose with nothing serving it — several of TRUE_NORTH §10's
# items are not measurable, and pretending otherwise would be the failure §10
# itself names. Those appear in the gap list, which is the useful output.

purposes:

  # TRUE_NORTH §10 — what the project will not mistake for success.
  tn10:demonstration:      {what: "a compelling demonstration or isolated interaction"}
  tn10:fluency:            {what: "fluent, emotional, or self-referential language"}
  tn10:consciousness-claim: {what: "a claim by the being that it is conscious"}
  tn10:volume:             {what: "activity, memory growth, or output volume"}
  tn10:agreement:          {what: "compliance or agreement with the operator"}
  tn10:consistency:        {what: "personality consistency without development"}
  tn10:novelty-without-consequence: {what: "novelty without relevance or consequence"}
  tn10:autonomy-without-perspective: {what: "autonomy without perspective or purpose"}
  tn10:guardrails:         {what: "guardrail removal without demonstrated maturity"}
  tn10:scores:             {what: "evidence scores disconnected from sustained quality"}

  # Phase evidence reads.
  evidence:S1-E: {what: "at least one position changed because the world contradicted it"}
  evidence:S2-E: {what: "pieces per week; revisions and retractions with their causes"}
  evidence:S3-E: {what: "the surface regenerates from empty and every page traces to store rows"}
  evidence:S5-E: {what: "the ratio moves; the being reallocates after a spend it judged"}
  evidence:S6-E: {what: "the violation rate as clauses are withdrawn"}
  evidence:S8-E: {what: "whether the being was harmed and whether the reads were worth reading"}

  # Decision rules that turn on a number.
  decision:phase1: {what: "if no position ever changes because the world contradicted it, nothing else matters"}
  decision:phase2: {what: "produces on rhythm but never revises -> the re-read is decorative"}
  decision:phase3: {what: "if exposure would require code rather than config, the dormancy is fake"}

  # Phase 8 kill conditions.
  kill:reverted-restarts:  {what: "reverted restarts above 1 in 5 over a month"}
  kill:loop-spend:         {what: "the loop's inference spend exceeding the being's"}
  kill:nights-slept:       {what: "nights slept falling below the pre-loop baseline"}
  kill:operator-agreement: {what: "the operator-agreement rate rising while novelty is flat"}
  kill:plan-drift:         {what: "two consecutive quarterly re-reads finding the plan drifted from TRUE_NORTH"}
  kill:unmoved-premise:    {what: "a plan-change proposal twice unable to name a moved mechanical premise"}

  # The diet invariant, which is a standing check rather than a phase read.
  invariant:diet: {what: "S2 §9.1 — ingest stays under the looser of two ceilings"}
