# The plan's epics, machine-readable (P4 epic E2.11).
#
# **Hand-derived, deliberately.** P4 says so: deriving this automatically loses
# what "the line this epic must not cross" is doing in E1.0, and that paragraph
# IS the epic. What is scaffolded from PLAN is only what a drift check can
# re-derive — id, title, dependencies, whether it is built. What is authored is
# the judgment: how each Done-when can be closed, what each epic binds, and the
# falsifier the plan states in prose.
#
# The first scaffold got E1.0 wrong, which is the argument in miniature. Its
# `Depends on:` line reads "nothing. **E5.2's deliberation floor is pulled
# forward with it**", and a regex read that as a dependency on E5.2. A reader
# does not make that mistake; a generator does.
#
# `done_when` classes:
#   mechanical         a test can close it
#   in-life            needs the being running for a window; no test closes it
#   operator-judgment  a human verdict, and Rule 6 keeps it that way
#   dormant            Phase 7, which has no Done-when by decision
#
# `done_when_sha` pins the acceptance criterion itself (P4 W9): the first 16 hex
# of the SHA-256 of PLAN's `Done when` clause, whitespace-normalised so a reflow
# is not an amendment. hard_core.yaml says PLAN is protected by *section* and
# that no check reads sections — the loop may append completion records and may
# never edit a `Done when`, and nothing enforced the second half. Only that
# clause is pinned: not the intent, not the hooks, not the decision rules,
# because this plan is edited constantly and a check that fires on every
# ordinary edit teaches its own bypass. When the operator changes a criterion,
# updating the hash is the act that records they meant to.
#
# newz/evidence/epics.py::drift fails the build when a row and PLAN disagree.

