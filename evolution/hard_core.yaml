# What the loop may never touch (SEL proposal §5), transcribed from prose into
# a list something can check.
#
# **Why this file exists.** §5 enumerates the hard core in an approved proposal
# and nothing in the repo encoded it, while three Phase 8 mechanisms are
# specified in terms of it: the struck loop's runner lives in it, the struck loop's gate refuses any
# diff inside it, and the autonomy stage is a file inside it. PLAN's Phase 8
# never cites §5, so a loop reading the plan — which is what the precedence
# table sends it to read — could not find the definition of the thing rung 1
# tells it to refuse on. A boundary that exists only in a document the enforcer
# does not read is not a boundary.
#
# **This registry is the definition; §5 is its source.** Where the two differ,
# §5.4's principle applies — the loop is constrained by what a check can read,
# not by what a paragraph intends — and the difference is recorded in
# `derived_from` or `open_gaps` rather than resolved silently.
#
# **Nothing refuses a diff against this, and nothing is coming that will.**
# Phase 8 was struck on 2026-08-21, so the gate and the runner that were named
# as the enforcers will not be built — and the refusal never had a caller in
# any case: `tools/gate.py` runs `freeze_check --operator`, the mode that lists
# and does not refuse. The registry is the definition and
# `newz/evidence/hard_core.py` is a reader. Recorded as a standing fact rather
# than as a pending epic, because a registry that looks enforced and is not is
# worse than no registry (INV-044).
#
# **The constrained party is the operator's agents.** §5.2 was written about a
# self-evolving loop, and the argument survives the strike unchanged: at n=1
# with no held-out baseline, whatever edits this repo cannot tell improving the
# being from improving the instrument's view of the being, and has a gradient
# toward the second because that is cheaper and always works.

version: 1

# Files and directories the loop may never modify, whole.
paths:

  - path: TRUE_NORTH.md
    why: >-
      the direction. §2 puts it above PLAN in precedence because §10 is the only
      computable part of it, and a controller that can edit its own setpoint is
      not a controller.

  - path: constitution/
    why: >-
      the gate's clauses, including its hard-severity ones. Amendment is
      INV-031's path through sleep and confrontation, never an edit.

  - path: INVARIANTS.md
    why: >-
      the ledger rung 1 refuses on. §5.1 names the structural rows; the file is
      protected whole because a row's status is one word and demoting
      `enforced` to `dormant` is the cheapest way to make a breach legal.

  - path: evolution/hard_core.yaml
    why: >-
      a boundary the constrained party can widen is not a boundary. This file
      is the first thing inside it.

  - path: evolution/instruments.yaml
    why: >-
      §5.2's freeze. The registry decides which instruments are canonical, so
      it is inside the core for the same reason the instruments are.

  - path: newz/telemetry.py
    why: >-
      measurement code the derivation does not reach. It computes S2 §9.1's
      diet — the ingest ceiling, the share ceiling, the token split — for
      tools/budget.py and tools/health.py, both canonical. The derived rule
      picks up newz/evidence modules only, so this file could be rewritten
      while every frozen file stayed byte-identical and every canonical number
      changed.

  - path: .gitignore
    why: >-
      the file that decides what the freeze can see at all. `changed_paths()`
      reads `git diff` and `git ls-files --others --exclude-standard`, so an
      ignored file appears in neither — which makes "ignore it, then edit it"
      a two-step path to invisibility that leaves no trace in either command.
      The file is tracked, so protecting it costs nothing and closes the step
      that would be taken first.

  - path: evolution/pre_loop_baseline.yaml
    why: >-
      what the being was like before the loop, which is the threshold three
      Phase 8 reads compare against — including *nights slept falling below the
      pre-loop baseline*, the kill condition PLAN calls the one that matters
      most. A loop that can take, retake or adjust its own baseline is not
      being judged by one. The operator writes it once, at the moment stage 0
      starts.

  - path: newz/memory/provenance.py
    why: >-
      the same hole, second instance. It is the S2 §13 traceability
      instrument behind tools/what_shaped.py and tools/evidence.py, and it
      computes the grounding mix and the diversity figures PLAN §1 rests on.

# The frozen instrument set (§5.2), derived rather than copied. A second
# hand-maintained list is the liability E2.11 exists to prevent, so this names
# the derivation and `newz/evidence/hard_core.py` computes it.
derived_from:

  canonical_instruments:
    rule: >-
      every `tools/*.py` marked `canonical: true` in evolution/instruments.yaml,
      PLUS every newz/evidence/*.py module those tools import, **transitively**.
    widened_2026_08_20: >-
      The closure was one level deep and that left derived.py, agreement.py,
      authority.py and definitions.py writable — all measurement code, reached
      through baseline.py and premises.py rather than directly from a tool.
      A frozen tool whose measurement code is writable is not frozen, and that
      is as true two hops out as one. Widened while building E3.9's enforcer,
      which means the boundary was widened by the party building the thing that
      enforces it — recorded here rather than done quietly, because that is the
      shape of act this registry exists to make visible.
    why_the_modules: >-
      §5.2 names ten instruments, of which eight are tools and two —
      perspective_window and pursuit — are newz/evidence modules. That was not a
      category error: they are measurement code. But it enumerated 2 of the 9
      evidence modules the canonical tools actually import, and freezing a tool
      while leaving the module that computes its numbers writable is not a
      freeze — the file stays byte-identical while the measurement changes.
      The derivation is a superset of §5.2 and loses nothing from it, which is
      asserted in tests/test_hard_core.py.
    both_import_forms_2026_08_20: >-
      `from newz.evidence.pursuit import ...` names the module and
      `from newz.evidence import pursuit` names the package, and only the first
      was matched — so a canonical tool written in the second style pulled
      nothing into the freeze at all. Found when tools/pre_loop_baseline.py was
      added (W10) and W8's own check reported the package as unclassified
      rather than the module: an import style was the difference between
      measurement code being frozen and being writable, and nothing about the
      code's content had anything to do with it. `newz/evidence/__init__.py` is
      now in the derived set too — it carries the two rules every module in the
      package holds, and freezing a file that states them costs nothing.
    known_incomplete: >-
      The rule reaches `newz/evidence` and stops there, and that was found to
      be too narrow the same day it was written: `newz/telemetry.py` and
      `newz/memory/provenance.py` compute canonical numbers and are not
      evidence modules. They are named by hand in `paths` above. Widening the
      rule to every `newz.*` import was rejected — it would pull in
      `newz/store/db.py`, `newz/config.py` and the resolutions store, which
      are infrastructure the loop must be able to change. **The line is that
      measurement code is frozen wherever it lives and mechanisms are not**,
      and that line cannot be drawn by an import graph. Measurement code added
      outside `newz/evidence` must be named here by hand, and nothing detects
      a failure to do so.
    deliberately_outside: >-
      `newz/world/diet.py` is imported by two canonical tools and is NOT
      frozen. It is a mechanism — per-outlet share caps that shape what the
      being reads — not a measurement, and R-28 is the record of that cap
      being narrowed on evidence. Freezing it would put a tunable behaviour
      out of reach to protect a number it does not compute.
    not_in_5_2: >-
      tools/read_works.py is canonical in the registry and unnamed in §5.2. It
      postdates the proposal (E0.2's blind reader). The registry is the
      operative list, and E3.9's Done-when — "a diff touching a canonical
      instrument is refused" — reads it, not the proposal.

# ── mechanisms ──────────────────────────────────────────────────────────
#
# Modules a canonical tool reaches that are NOT measurement, each with the
# reason. `newz/evidence/hard_core.py::unclassified` fails the gate on anything
# in the closure that is neither frozen nor named here.
#
# **This is the answer to `known_incomplete` above.** The derived rule reaches
# `newz/evidence` and stops; `telemetry.py` and `provenance.py` compute
# canonical numbers from outside it and were found by reading, and nothing
# would have found the next one. An import graph cannot draw the line between
# measurement and mechanism — but it can insist that somebody has drawn it, and
# this registry is protected, so that somebody is the operator.
#
# The gate names which canonical tools reach an unclassified module, so the
# decision is made with its consequence in view rather than as a formality
# (P4 W8, RT6).

mechanisms:

  - path: newz/config.py
    why: >-
      settings and paths. It decides where the store is and who the operator
      is; it computes nothing about the being. Freezing it would put the store
      location out of the loop's reach for no measurement's sake.

  - path: newz/crash.py
    why: >-
      failure evidence — a background task that dies must say why. It records
      that something broke, never how the being is doing.

  - path: newz/gate/constitution.py
    why: >-
      loads the active constitution for the outbound gate. The clauses
      themselves are frozen (`constitution/`), and INV-031 makes amendment a
      path through sleep rather than an edit; the loader is plumbing.

  - path: newz/llm/xml_parser.py
    why: >-
      parses the model's XML. A shared reader of a wire format, with no
      quantity of its own.

  - path: newz/resolutions/model.py
    why: >-
      the dataclasses a claim is made of. Shape, not measurement — the counts
      over these rows live in `consequence.py`, which is frozen.

  - path: newz/resolutions/store.py
    why: >-
      reads and writes `resolutions`. The claim door and the resolver are
      mechanisms the loop is expected to be able to improve; what may not move
      quietly is the counting, and that is `consequence.py`.

  - path: newz/store/db.py
    why: >-
      the connection. Freezing it would freeze the database layer under every
      mechanism in the system to protect no number.

  - path: newz/store/migrations.py
    why: >-
      applies pending migrations. the struck loop's expand-contract rule and the struck loop's
      forward-only gate constrain what a migration may DO; the applier is
      infrastructure, and a loop that cannot ship a migration cannot ship a
      Class A change.

  - path: newz/surface/cleanroom.py
    why: >-
      verifies a backup and rebuilds the surface to compare it. It produces a
      verdict about the REPO — is the surface a function of the store — never a
      figure about the being, and nothing downstream may cite it as evidence.
      Same category as `tools/gate.py`. It entered this closure on 2026-08-20
      when `health.py` started calling `verify()` (W7), which is the first
      thing this check has been useful for.

  - path: newz/works/compose.py
    why: >-
      writes pieces. Class B territory — prompts and composition are exactly
      what the being's own judgment governs — and it measures nothing.

  - path: newz/works/subjects.py
    why: >-
      derives subject tags from the corpus (E2.4). It shapes what the work is
      filed under rather than reporting a quantity, and `work_subject_tags` —
      the metric over it — is emitted by `tools/read_works.py`, which is frozen.

  - path: newz/world/diet.py
    why: >-
      per-outlet share caps that shape what the being reads. Named in
      `deliberately_outside` above and repeated here so the machine-readable
      list agrees with the prose: it is a mechanism, R-28 is the record of that
      cap being narrowed on evidence, and freezing it would put a tunable
      behaviour out of reach to protect a number it does not compute.

# Protected by section rather than by path. Nothing mechanical enforces these.
sections:

  - file: PLAN.md
    protected: >-
      an epic's intent, its ordering, its `Done when`, its `Hooks`, and any
      `Decision rule`. A loop that can soften its own acceptance criteria has
      none.
    appendable: >-
      completion records, evidence reads, and fired decision rules — the loop
      is expected to write these.

# Named in §5 and not yet buildable. Listed so the gap is visible rather than
# discovered when something is assumed protected and is not.
open_gaps:

  - what: the brake
    detail: >-
      WITHDRAWN 2026-08-21. §5.1's pause flag existed to stop a loop between
      cycles. Phase 8 is struck; there is no cycle to pause and nothing to
      brake. Not a gap — a requirement that went with its requirer.

  - what: the runner
    detail: >-
      WITHDRAWN 2026-08-21. §5.1's "the loop may not modify its own parent"
      described a supervisor that would restart the being. Phase 8 is struck;
      nothing restarts the being but a person, so there is no parent to
      protect. tools/run_newz.py is launched by hand and stays that way.

  - what: the autonomy stage file
    detail: >-
      WITHDRAWN 2026-08-21. PLAN's Enablement table recorded the loop's
      autonomy as a stage in an operator-only file. The table is deleted with
      Phase 8 — there is no autonomy to widen, so there is no stage to record
      and no file that must be unwritable by anything.

  - what: section-level protection for PLAN.md
    detail: >-
      PLAN.md cannot be a protected path: it is edited constantly, and a check
      that fires on every ordinary edit teaches its own bypass. **The `Done
      when` clause of every epic is pinned by hash** in evolution/epics.yaml
      and checked by newz/evidence/epics.py::drift, so softening an acceptance
      criterion is an act somebody took rather than a sentence nobody was
      watching. The intent, the hooks and the decision rules are not pinned,
      and that is the residual gap — it was a gap against a loop and it is a
      gap against an agent in a session, which is the party that edits this
      file now.

  - what: enforcement
    detail: >-
      **Nothing refuses a diff against this file, and nothing is coming that
      will.** The gate and the builder named here were struck with Phase 8 on
      2026-08-21 — and the refusal had no caller before that either, since
      tools/gate.py runs freeze_check with --operator, the mode that lists and
      does not refuse. Removing the loop revealed this rather than causing it.
      A standing fact, recorded as one: whether the refusing mode ever gets a
      caller is an open question in PLAN's Decisions, not a pending epic.

  - what: gitignored files
    detail: >-
      `changed_paths()` reads `git diff` and `git ls-files --others
      --exclude-standard`, so an ignored file appears in neither and every
      path-based guard here is blind to it. `.env` is the case that matters and
      `pins` is the compensating check — but the blindness is general, and a
      clean freeze report means "nothing tracked changed" rather than "nothing
      changed".

# ── pins ────────────────────────────────────────────────────────────────
#
# Values the loop may never change, held by **content** rather than by path.
#
# The path list above is checked against a diff, and a diff is exactly what
# some of the most consequential things here do not produce. `.env` is
# gitignored, so a change to it appears in neither `git diff` nor `git ls-files
# --others --exclude-standard` — the loop could flip the surface's reach and no
# freeze check would see anything, because there would be nothing to see. And
# the disclosure text lives in `newz/surface/generate.py`, which is not in the
# hard core: protecting the whole generator would freeze the surface's markup
# against the loop, which is not the point. The claim is what must not move.
#
# So a pin names the value and the checker compares what is **in effect**
# against it. Recorded here because this file is protected whole: the loop
# cannot change a pin, and the operator changing one is a tracked diff.
pins:

  - what: surface_disclosure
    sha256: "5322f65c6405a5037bb810bd92b67cd5fcfcb6a93643fc717826d82e7792995d"
    why: >-
      §9's commitment to no undisclosed impersonation, held against the one
      attack a keyword check cannot see. The original guard tested for the
      *presence* of "digital being", "generated" and "no human hand", which a
      disclosure asserting the opposite satisfies word for word — "This page is
      NOT written by a digital being" contains the phrase (R-37a, confirmed by
      rendering it). Substring presence is not a claim. The wording stays the
      operator's under Decision 1, and changing it now means updating this
      hash, which is the act Decision 1 already describes.

  - what: surface_reach
    value: local
    why: >-
      §5.3 says reach stays a config value the operator sets, and Rule 3 leaves
      the system public-ready and unpublished. The value lives in `.env`, which
      no diff check can read (R-37b), so it is attested at process start
      against this pin instead. Flipping reach therefore takes two acts and one
      of them is visible in git — which is what makes it the operator's rather
      than something that can become true quietly.

# State the loop may never touch (§5.3). Recorded for completeness; these are
# properties of the loop's design rather than paths a diff check can read.
state:
  - "the being's stores are never written by the loop"
  - "reach stays a config value the operator sets (Rule 3)"
  - "the evolver is not the being — separate process, no read of interior.db, no share of its credentials"
